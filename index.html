<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <!-- YouTube Playables SDK - kept ONLY on the Playgama build, which IS the
       Playables submission (Playgama forwards that one archive to YouTube).
       Stripped everywhere else by vite.config.ts.

       Load-bearing twice over. YouTube's integration requirements say the SDK
       MUST load before any game code executes; and the Playgama Bridge's own
       `youtube` adapter polls for `window.ytgame` on a 100 ms interval with NO
       timeout, so without this tag `bridge.initialize()` never settles and
       Playables shows a blank screen with every other check green.

       IN <head>, AND FIRST, on purpose. Vite injects the entry bundle as a
       `<script type="module">` into the head at build time — so a tag placed
       down in <body> with the other portal SDKs loads AFTER the game's own
       code in document order, which is the thing the requirement forbids.
       A classic (non-module) script here is parser-blocking and modules are
       deferred regardless, so this is guaranteed to run first. -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  <!-- Web Storage shim. MUST stay the first of OUR scripts and MUST stay a
       classic (non-module) tag: module scripts are deferred, so a shim installed
       from inside the module graph runs after the entry chunk's static imports.
       On YouTube Playables `window.localStorage` is NULL, and `main.ts` hands it
       straight to `new SaveManager(...)`, which binds its methods in the
       constructor — a blank screen before the splash clears. Ships on every
       build: sandboxed iframes and blocked-storage embeds fail the same way.
       Vite rewrites the path to `./js/storage-shim.js` under `--base=./`. -->
  <script src="/js/storage-shim.js"></script>
  <meta name="color-scheme" content="dark only">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <!-- CSP meta tag injected by vite.config.ts at build time -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#150c2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chaos Machine">
  <meta name="description" content="Infiltrate neon fortresses as a silent mech. Snipe guards, strike from the shadows with your energy blade, or go loud with minigun and rockets when the alarm sounds.">
  <link rel="manifest" href="/manifest.json">
  <title>Chaos Machine</title>
  <style>
      /* The splash paints before any JS runs, so its styles are inlined here.
         It is the same picture FLogoProgress.vue draws, at the same size in
         the same place, so the handover when Vue mounts moves nothing: the
         mech's visor head in the hex badge over the CHAOS / MACHINE
         wordmark, as ONE inline SVG of paths (no ids, no text, so no web font
         can reflow it before the bundled faces load), above the plasma bar.
         Change one, change both: tests/ui/splashLogo.test.ts holds the two to
         the same markup and the same sizes. */
      body {
          margin: 0;
          background-color: #150c2b;
          outline: none;
      }

      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          background: radial-gradient(circle at 50% 40%, rgba(255, 79, 182, 0.2) 0%, rgba(255, 79, 182, 0) 34%), radial-gradient(circle at 50% 40%, #3d2a80 0%, #1f1244 55%, #150c2b 100%);
          transition: opacity 0.4s ease-out;
      }

      #static-splash.hidden {
          opacity: 0;
          pointer-events: none;
      }

      .s-grid {
          position: absolute;
          inset: -64px 0 0 -64px;
          background-image: linear-gradient(rgba(77, 232, 255, 0.1) 2px, transparent 2px), linear-gradient(90deg, rgba(77, 232, 255, 0.1) 2px, transparent 2px);
          background-size: 64px 64px;
          animation: s-pan 6s linear infinite;
      }

      @keyframes s-pan { to { transform: translate3d(64px, 64px, 0); } }

      .s-card {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: clamp(10px, 3vmin, 20px);
          width: min(84vw, 70vh, 420px);
      }

      .s-logo {
          width: 100%;
          aspect-ratio: 300 / 256;
      }

      .s-logo svg {
          display: block;
          width: 100%;
          height: 100%;
      }

      /* The plasma bar: a pink plasma fill in a dark capsule, leaning with the
         wordmark. ONE fill scaled by transform, so it creeps on the
         COMPOSITOR from the first byte, before any script runs: a slow portal
         SDK or a slow network never looks like a frozen page, and the Vue
         loader then continues from wherever this has got to. */
      .s-bar {
          position: relative;
          width: 76%;
          height: clamp(12px, 2.6vmin, 18px);
          border: 2px solid #4de8ff;
          background: #150c2b;
          box-shadow: 0 0 12px rgba(77, 232, 255, 0.45);
          box-sizing: border-box;
          transform: skewX(-12deg);
          clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
      }

      .s-track, .s-lit {
          position: absolute;
          inset: 1px;
          clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
      }
      .s-track { background: linear-gradient(#2b1b5c, #150c2b); }
      .s-lit { overflow: hidden; }
      .s-fill {
          width: 100%;
          height: 100%;
          background: linear-gradient(#ffe3f4 0%, #ff8fd2 35%, #ff4fb6 62%, #a91d70 100%);
          transform-origin: left center;
          transform: scaleX(0);
          animation: s-creep 5s cubic-bezier(0.15, 0.7, 0.3, 1) forwards;
      }
      @keyframes s-creep {
          to { transform: scaleX(0.1); }
      }

      @media (prefers-reduced-motion: reduce) {
          .s-grid { animation: none; }
          .s-fill { animation-duration: 0.01s; }
      }
  </style>
</head>
<body>
<div id="static-splash">
  <div class="s-grid" aria-hidden="true"></div>
  <div class="s-card">

6v6h-6zM51 226h6v6h-6zM27 232h6v6h-6zM51 232h6v6h-6zM69 196h18v6h-18zM63 202h6v6h-6zM87 202h6v6h-6zM63 208h6v6h-6zM87 208h6v6h-6zM63 214h30v6h-30zM63 220h6v6h-6zM87 220h6v6h-6zM63 226h6v6h-6zM87 226h6v6h-6zM63 232h6v6h-6zM87 232h6v6h-6zM105 196h18v6h-18zM99 202h6v6h-6zM123 202h6v6h-6zM99 208h6v6h-6zM99 214h6v6h-6zM99 220h6v6h-6zM99 226h6v6h-6zM123 226h6v6h-6zM105 232h18v6h-18zM135 196h6v6h-6zM159 196h6v6h-6zM135 202h6v6h-6zM159 202h6v6h-6zM135 208h6v6h-6zM159 208h6v6h-6zM135 214h30v6h-30zM135 220h6v6h-6zM159 220h6v6h-6zM135 226h6v6h-6zM159 226h6v6h-6zM135 232h6v6h-6zM159 232h6v6h-6zM171 196h30v6h-30zM183 202h6v6h-6zM183 208h6v6h-6zM183 214h6v6h-6zM183 220h6v6h-6zM183 226h6v6h-6zM171 232h30v6h-30zM207 196h6v6h-6zM231 196h6v6h-6zM207 202h12v6h-12zM231 202h6v6h-6zM207 208h6v6h-6zM219 208h6v6h-6zM231 208h6v6h-6zM207 214h6v6h-6zM225 214h12v6h-12zM207 220h6v6h-6zM231 220h6v6h-6zM207 226h6v6h-6zM231 226h6v6h-6zM207 232h6v6h-6zM231 232h6v6h-6zM243 196h30v6h-30zM243 202h6v6h-6zM243 208h6v6h-6zM243 214h24v6h-24zM243 220h6v6h-6zM243 226h6v6h-6zM243 232h30v6h-30z" fill="#5fe3f5" stroke-width="5" paint-order="stroke"/></g></svg></div>
    <div class="s-bar"><div class="s-track"></div><div class="s-lit"><div class="s-fill"></div></div></div>
  </div>
</div>
<!-- Load the SDK before your game code -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<!-- No Playgama Bridge tag: v2 is bundled from the @playgama/bridge npm package
     (src/utils/playgamaBridgeLoader.ts). The v1 CDN script fetched its adapter
     chunks from bridge.playgama.com at runtime and injected them as script tags,
     neither of which YouTube Playables allows — and Playgama QA rejects v1. -->
<!-- Load the SDK before your game code -->
<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
<!-- Poki SDK - stripped for non-Poki builds by vite.config.ts -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
