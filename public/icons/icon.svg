<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Chaos Machine app icon: the mech's visor head in the hex badge.
       ONE file for every size. Below 41 CSS px (a browser tab) a media query,
       evaluated against the image's own size, swaps the badge (.d) for a bold
       head that fills the tile (.s). The tile itself is .bg, so
       scripts/render-icons.mjs can square it off for the full-bleed maskable
       and apple-touch renders. Edit this file, then run that script: every
       PNG and favicon.ico is rendered from it. -->
  <defs>
    <radialGradient id="b" cx="50%" cy="40%" r="66%">
      <stop offset="0" stop-color="#6a4bd0"/>
      <stop offset=".58" stop-color="#3a2a6e"/>
      <stop offset="1" stop-color="#1c1233"/>
    </radialGradient>
    <radialGradient id="g" cx="50%" cy="46%" r="46%">
      <stop offset="0" stop-color="#ff5fb7" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ff5fb7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>.s{display:none}@media (max-width:40px){.d{display:none}.s{display:inline}}</style>
  <g class="bg">
    <rect width="512" height="512" rx="112" fill="url(#b)"/>
    <rect width="512" height="512" rx="112" fill="url(#g)"/>
  </g>
  <g class="d" stroke="#1c1233" stroke-linejoin="round" stroke-linecap="round" transform="translate(256 262) scale(3.5) translate(-150 -60)">
    <path d="M196.8 87L150 114L103.2 87L103.2 33L150 6L196.8 33z" fill="#3a2a6e" stroke-width="7"/>
    <path d="M187.2 81.5L150 103L112.8 81.5L112.8 38.5L150 17L187.2 38.5z" fill="none" stroke="#5fe3f5" stroke-width="3"/>
    <path d="M150 22v12" fill="none" stroke-width="5"/>
    <circle cx="150" cy="20" r="5" fill="#ff5fb7" stroke-width="4"/>
    <path d="M112 52h10v22h-10zM178 52h10v22h-10z" fill="#5fe3f5" stroke-width="4"/>
    <path d="M128 34h44l10 12v34l-10 10h-44l-10-10V46z" fill="#b9a6ff" stroke-width="5"/>
    <path d="M126 50h48v20h-48z" fill="#1c1233" stroke-width="4"/>
    <path d="M134 56h10v8h-10zM156 56h10v8h-10z" fill="#ff5fb7" stroke="none"/>
  </g>
  <g class="s" stroke="#1c1233" stroke-linejoin="round" stroke-linecap="round" transform="translate(256 276) scale(5.6) translate(-150 -60)">
    <path d="M150 22v12" fill="none" stroke-width="7"/>
    <circle cx="150" cy="20" r="6" fill="#ff5fb7" stroke-width="5"/>
    <path d="M110 50h12v26h-12zM178 50h12v26h-12z" fill="#5fe3f5" stroke-width="5"/>
    <path d="M128 34h44l10 12v34l-10 10h-44l-10-10V46z" fill="#b9a6ff" stroke-width="6"/>
    <path d="M126 50h48v20h-48z" fill="#1c1233" stroke-width="4"/>
    <path d="M132 55h13v10h-13zM155 55h13v10h-13z" fill="#ff5fb7" stroke="none"/>
  </g>
</svg>
